<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MorvehTV · Extractor y Sincronizador de Nube para DooPlay</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #181c26;
      --border: #2a3040;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
      --purple: #8b5cf6;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 820px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }
    h1 { margin: 0 0 6px; font-size: 1.4rem; }
    p.sub { margin: 0 0 18px; color: var(--muted); font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-player { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .grid-auth { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
    .grid-3 { display: grid; grid-template-columns: 2fr 1fr auto; gap: 10px; align-items: end; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b0e14;
      color: var(--text);
      font-size: 0.95rem;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.btn-sec { background: #334155; }
    button.btn-sec:hover { background: #475569; }
    button.btn-cloud { background: var(--purple); }
    button.btn-cloud:hover { background: #7c3aed; }
    button.btn-publish { width: 100%; margin-top: 8px; padding: 13px; font-size: 1rem; background: var(--green); }
    button.btn-publish:hover { background: #059669; }
    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
      background: #0b0e14;
      padding: 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .mode-tab {
      background: transparent;
      color: var(--muted);
      padding: 9px 6px;
      border-radius: 7px;
      font-size: 0.86rem;
    }
    .mode-tab.active {
      background: var(--accent);
      color: #fff;
    }
    #conn-status { font-size: 0.85rem; margin-bottom: 14px; }
    #preview-card {
      display: none;
      margin-bottom: 16px;
      padding: 14px;
      background: #0b0e14;
      border: 1px solid var(--border);
      border-radius: 10px;
      gap: 14px;
    }
    #preview-card img {
      width: 110px;
      height: 165px;
      object-fit: cover;
      border-radius: 6px;
      background: #1e293b;
    }
    .folder-card {
      background: #0b0e14;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .folder-head {
      display: grid;
      grid-template-columns: 1.5fr 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }
    .file-list {
      max-height: 150px;
      overflow-y: auto;
      font-size: 0.84rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    #sync-log {
      margin-top: 12px;
      padding: 12px;
      background: #0b0e14;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }
    #output { margin-top: 14px; font-size: 0.92rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <h1>MorvehTV · Extractor y Sincronizador de Nube</h1>
    <p class="sub">Detecta las carpetas de <strong>nube.morvehtv.com</strong> y publica cada película o serie en su categoría exacta de DooPlay.</p>

    <div class="grid-auth">
      <div class="field">
        <label for="wp-user">Usuario WordPress</label>
        <input type="text" id="wp-user" placeholder="Tu usuario admin" required />
      </div>
      <div class="field">
        <label for="wp-pass">Contraseña de Aplicación WP</label>
        <input type="password" id="wp-pass" placeholder="xxxx xxxx xxxx xxxx" required />
      </div>
      <div class="field">
        <button type="button" id="btn-test-wp" class="btn-sec">Probar conexión WP</button>
      </div>
    </div>
    <div id="conn-status"></div>

    <div class="field">
      <label for="tmdb-api">API Key de TMDB (v3)</label>
      <input type="text" id="tmdb-api" placeholder="Pega tu API Key de TMDB" required />
    </div>

    <label>Modo de trabajo</label>
    <div class="mode-tabs">
      <button type="button" class="mode-tab active" data-mode="nube">Sincronizar Carpetas Nube</button>
      <button type="button" class="mode-tab" data-mode="ficha">Película / Ficha Manual</button>
      <button type="button" class="mode-tab" data-mode="temporada">Temporada (Season)</button>
      <button type="button" class="mode-tab" data-mode="episodio">Episodio Individual</button>
    </div>
    <input type="hidden" id="publish-mode" value="nube" />

    <!-- PANEL 1: SINCRONIZACIÓN DE CARPETAS DE NUBE.MORVEHTV.COM -->
    <div id="cloud-sync-panel">
      <div class="grid-3">
        <div class="field">
          <label for="cloud-endpoint">Endpoint JSON de tu Nube</label>
          <input type="url" id="cloud-endpoint" value="https://nube.morvehtv.com/api/catalogo" />
        </div>
        <div class="field">
          <label for="cloud-key">Clave API Nube (opcional)</label>
          <input type="password" id="cloud-key" placeholder="Si usas X-Api-Key" />
        </div>
        <div class="field">
          <button type="button" id="btn-scan-cloud" class="btn-cloud">Escanear carpetas</button>
        </div>
      </div>

      <div id="cloud-folders-container"></div>
      <div id="sync-log"></div>
    </div>

    <!-- PANEL 2: PUBLICACIÓN MANUAL (FICHA / TEMPORADA / EPISODIO) -->
    <form id="generator-form" style="display:none;">
      <div class="grid-3">
        <div class="field">
          <label for="tmdb-id">ID de TMDB o IMDb (de la película o de la serie madre)</label>
          <input type="text" id="tmdb-id" placeholder="Ej. tt33579608 o 1399" required />
        </div>
        <div class="field" id="seccion-wrapper">
          <label for="seccion">Sección en MorvehTV</label>
          <select id="seccion">
            <option value="peliculas">Películas</
