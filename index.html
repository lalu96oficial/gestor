<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MorvehTV · Gestor Manual Sincronizado</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #181c26;
      --border: #2a3040;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 820px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    h1 { margin: 0; font-size: 1.35rem; }
    p.sub { margin: 0 0 18px; color: var(--muted); font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-player { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .grid-auth { display: grid; grid-template-columns: 1.1fr 1fr 1.2fr auto; gap: 10px; align-items: end; }
    .grid-3 { display: grid; grid-template-columns: 2fr 1fr auto; gap: 10px; align-items: end; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 0.84rem; color: var(--muted); margin-bottom: 6px; }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b0e14;
      color: var(--text);
      font-size: 0.94rem;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.btn-sec { background: #334155; }
    button.btn-sec:hover { background: #475569; }
    button.btn-danger { background: #7f1d1d; }
    button.btn-danger:hover { background: #991b1b; }
    button.btn-publish { width: 100%; margin-top: 8px; padding: 13px; font-size: 1rem; background: var(--green); }
    button.btn-publish:hover { background: #059669; }
    #conn-status { font-size: 0.85rem; margin-bottom: 14px; line-height: 1.45; }
    #preview-card {
      display: none;
      margin-bottom: 16px;
      padding: 14px;
      background: #0b0e14;
      border: 1px solid var(--border);
      border-radius: 10px;
      gap: 14px;
      align-items: center;
    }
    #preview-card img {
      width: 100px;
      height: 150px;
      object-fit: cover;
      border-radius: 6px;
      background: #1e293b;
    }
    #output { margin-top: 14px; font-size: 0.92rem; line-height: 1.5; }
    #lock-screen {
      max-width: 420px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }
    @media (max-width: 720px) {
      .grid-auth, .grid-3, .grid-player, .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- PANTALLA DE BLOQUEO PRIVADA -->
  <div id="lock-screen" style="display:none;">
    <h2 style="margin:0 0 8px;font-size:1.25rem;">Acceso Privado · MorvehTV</h2>
    <p id="lock-desc" style="color:#94a3b8;font-size:0.88rem;margin:0 0 16px;">
      Introduce tu clave privada local para desbloquear tus credenciales.
    </p>
    <div class="field">
      <input type="password" id="pin-input" placeholder="Clave privada" />
    </div>
    <button type="button" id="btn-unlock" style="width:100%;">Entrar al Gestor</button>
    <div id="lock-err" style="color:#fca5a5;font-size:0.84rem;margin-top:10px;"></div>
  </div>

  <!-- PANEL PRINCIPAL -->
  <div class="container" id="main-app" style="display:none;">
    <div class="top-bar">
      <h1>MorvehTV · Gestor Manual Sincronizado</h1>
      <div style="display:flex;gap:8px;">
        <button type="button" id="btn-lock-now" class="btn-sec" style="padding:7px 11px;font-size:0.82rem;">Bloquear</button>
        <button type="button" id="btn-wipe-creds" class="btn-danger" style="padding:7px 11px;font-size:0.82rem;">Borrar datos</button>
      </div>
    </div>
    <p class="sub">Publicación sincronizada con WordPress y TMDB (en español) con reproductor interactivo de streaming.</p>

    <!-- CREDENCIALES WP -->
    <div class="grid-auth">
      <div class="field">
        <label for="wp-url">URL WordPress</label>
        <input type="url" id="wp-url" value="https://morvehtv.com" required />
      </div>
      <div class="field">
        <label for="wp-user">Usuario WP</label>
        <input type="text" id="wp-user" placeholder="Usuario admin" required />
      </div>
      <div class="field">
        <label for="wp-pass">Contraseña de Aplicación WP</label>
        <input type="password" id="wp-pass" placeholder="xxxx xxxx xxxx xxxx" required />
      </div>
      <div class="field">
        <button type="button" id="btn-test-wp" class="btn-sec">Probar WP</button>
      </div>
    </div>
    <div id="conn-status"></div>

    <div class="field">
      <label for="tmdb-api">API Key de TMDB (v3)</label>
      <input type="password" id="tmdb-api" placeholder="Pega tu API Key de TMDB" required />
    </div>

    <hr style="border:0;border-top:1px solid var(--border);margin:16px 0;" />

    <!-- FORMULARIO PRINCIPAL -->
    <form id="generator-form">
      <div class="grid-3">
        <div class="field">
          <label for="tmdb-id">ID de TMDB o IMDb (Ej. 1399 o tt0944947)</label>
          <input type="text" id="tmdb-id" placeholder="ID de la película o serie" required />
        </div>
        <div class="field">
          <label for="seccion">Sección en MorvehTV</label>
          <select id="seccion">
            <option value="peliculas">Películas</option>
            <option value="series">Series</option>
            <option value="peliculas-anime">Películas Anime</option>
            <option value="series-anime">Series Anime</option>
            <option value="documentales">Documentales</option>
            <option value="docuseries">Docuseries</option>
            <option value="programas-tv">Programas TV</option>
            <option value="telenovelas">Telenovelas</option>
          </select>
        </div>
        <div class="field">
          <button type="button" id="btn-check" class="btn-sec">Vista previa</button>
        </div>
      </div>

      <div id="preview-card">
        <img id="prev-poster" src="" alt="Portada" />
        <div>
          <strong id="prev-title" style="font-size:1.1rem;"></strong>
          <div id="prev-meta" style="color:#94a3b8;font-size:0.85rem;margin:4px 0 6px;"></div>
          <p id="prev-overview" style="margin:0;font-size:0.85rem;color:#cbd5e1;max-height:85px;overflow:auto;"></p>
        </div>
      </div>

      <div class="grid-player">
        <div class="field">
          <label for="servidor-nombre">Nombre Servidor</label>
          <input type="text" id="servidor-nombre" value="MorvehTV" />
        </div>
        <div class="field">
          <label for="tipo-formato">Tipo de Formato</label>
          <select id="tipo-formato">
            <option value="iframe">URL Embed (/v/...)</option>
            <option value="mp4">URL MP4 Directo</option>
            <option value="shortcode">Shortcode / HTML</option>
          </select>
        </div>
        <div class="field">
          <label for="idioma">Idioma</label>
          <select id="idioma">
            <option value="es">Español (Castellano)</option>
            <option value="la">Español Latino</option>
            <option value="sub">Subtitulado</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="stream-url">Enlace de la Nube (Reproductor)</label>
        <input type="text" id="stream-url" placeholder="https://nube.morvehtv.com/v/TU_TOKEN_PUBLICO" required />
      </div>

      <button type="submit" class="btn-publish">Publicar en MorvehTV</button>
    </form>

    <div id="output"></div>
  </div>

  <script>
    const SECCIONES_DOOPLAY = {
      'peliculas': 'Películas',
      'series': 'Series',
      'documentales': 'Documentales',
      'docuseries': 'Docuseries',
      'peliculas-anime': 'Películas Anime',
      'series-anime': 'Series Anime',
      'programas-tv': 'Programas TV',
      'telenovelas': 'Telenovelas'
    };

    const CRED_FIELDS = ['wp-url', 'wp-user', 'wp-pass', 'tmdb-api', 'servidor-nombre'];

    function saveAllLocal() {
      CRED_FIELDS.forEach(id => {
        const el = document.getElementById(id);
        if (el) localStorage.setItem('mtv_man_' + id, el.value);
      });
    }

    function loadAllLocal() {
      CRED_FIELDS.forEach(id => {
        const el = document.getElementById(id);
        const val = localStorage.getItem('mtv_man_' + id);
        if (el && val !== null) el.value = val;
      });
    }

    async function sha256Hex(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function initSecurityLock() {
      const lockScreen = document.getElementById('lock-screen');
      const mainApp = document.getElementById('main-app');
      const pinInput = document.getElementById('pin-input');
      const lockErr = document.getElementById('lock-err');
      const storedHash = localStorage.getItem('mtv_man_pin_hash');

      if (sessionStorage.getItem('mtv_man_unlocked') === '1' && storedHash) {
        lockScreen.style.display = 'none';
        mainApp.style.display = 'block';
        loadAllLocal();
        return;
      }

      lockScreen.style.display = 'block';
      mainApp.style.display = 'none';

      const unlockAction = async () => {
        const pin = pinInput.value.trim();
        if (pin.length < 4) {
          lockErr.textContent = 'Mínimo 4 caracteres.';
          return;
        }
        const hash = await sha256Hex(pin);
        if (!storedHash) {
          localStorage.setItem('mtv_man_pin_hash', hash);
          sessionStorage.setItem('mtv_man_unlocked', '1');
          lockScreen.style.display = 'none';
          mainApp.style.display = 'block';
          loadAllLocal();
        } else if (hash === storedHash) {
          sessionStorage.setItem('mtv_man_unlocked', '1');
          lockScreen.style.display = 'none';
          mainApp.style.display = 'block';
          loadAllLocal();
        } else {
          lockErr.textContent = 'Clave incorrecta.';
        }
      };

      document.getElementById('btn-unlock').addEventListener('click', unlockAction);
      pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') unlockAction(); });
    }

    function getWpBaseUrl() {
      const raw = document.getElementById('wp-url').value.trim() || 'https://morvehtv.com';
      return raw.replace(/\/+$/, '');
    }

    function getAuthHeader() {
      const user = document.getElementById('wp-user').value.trim();
      const pass = document.getElementById('wp-pass').value.replace(/\s+/g, '').trim();
      const bytes = new TextEncoder().encode(`${user}:${pass}`);
      let bin = '';
      bytes.forEach(b => { bin += String.fromCharCode(b); });
      return 'Basic ' + btoa(bin);
    }

    async function wpFetch(endpointPath, options = {}) {
      const base = getWpBaseUrl();
      const url = `${base}/wp-json${endpointPath}`;
      const headers = Object.assign({
        'Authorization': getAuthHeader(),
        'Accept': 'application/json'
      }, options.headers || {});

      return fetch(url, {
        ...options,
        mode: 'cors',
        credentials: 'omit',
        headers
      });
    }

    async function resolverTmdbId(idInput, tmdbApiKey, endpointTipo) {
      const id = idInput.trim();
      if (!id.startsWith('tt')) return id;

      const findRes = await fetch(
        `https://api.themoviedb.org/3/find/${encodeURIComponent(id)}?api_key=${encodeURIComponent(tmdbApiKey)}&external_source=imdb_id&language=es-ES`
      );
      const findData = await findRes.json();
      const resultados = endpointTipo === 'tv' ? findData.tv_results : findData.movie_results;
      if (!resultados || resultados.length === 0) {
        throw new Error(`No se encontró ningún título en TMDB para el IMDb ID: ${id}`);
      }
      return String(resultados[0].id);
    }

    async function consultarTMDB(tmdbIdInput, tmdbApiKey, seccionSlug) {
      const esSerie = ['series', 'series-anime', 'docuseries', 'programas-tv', 'telenovelas'].includes(seccionSlug);
      const endpointTipo = esSerie ? 'tv' : 'movie';
      const tmdbId = await resolverTmdbId(tmdbIdInput, tmdbApiKey, endpointTipo);

      const baseRes = await fetch(
        `https://api.themoviedb.org/3/${endpointTipo}/${encodeURIComponent(tmdbId)}?api_key=${encodeURIComponent(tmdbApiKey)}&language=es-ES&append_to_response=videos,credits,images&include_image_language=es,en,null`
      );
      if (!baseRes.ok) throw new Error(`Error al consultar TMDB (${baseRes.status})`);
      const baseData = await baseRes.json();

      if (!baseData.overview) {
        const fbRes = await fetch(`https://api.themoviedb.org/3/${endpointTipo}/${encodeURIComponent(tmdbId)}?api_key=${encodeURIComponent(tmdbApiKey)}&language=es-MX`);
        if (fbRes.ok) {
          const fb = await fbRes.json();
          if (fb.overview) baseData.overview = fb.overview;
        }
      }

      const castLista = (baseData.credits?.cast || []).slice(0, 10);
      const dirLista = (baseData.credits?.crew || []).filter(c => c.job === 'Director');
      const creadoresLista = baseData.created_by || [];
      const videos = baseData.videos?.results || [];
      const trailerObj =
        videos.find(v => v.site === 'YouTube' && v.type === 'Trailer' && v.iso_639_1 === 'es') ||
        videos.find(v => v.site === 'YouTube' && v.type === 'Trailer') ||
        videos.find(v => v.site === 'YouTube');

      const fecha = baseData.release_date || baseData.first_air_date || '';
      const anio = fecha ? fecha.slice(0, 4) : '';
      const posterPath = baseData.poster_path ? `https://image.tmdb.org/t/p/w500${baseData.poster_path}` : '';

      return {
        postTypeEndpoint: esSerie ? 'tvshows' : 'movies',
        tmdbId,
        titulo: baseData.title || baseData.name,
        sinopsis: baseData.overview || '',
        fecha,
        previewPoster: posterPath,
        metaInfo: `Nota: ${baseData.vote_average ? baseData.vote_average.toFixed(1) : 'N/A'} · Sección: ${SECCIONES_DOOPLAY[seccionSlug]}`,
        taxonomias: {
          dtcast: castLista.map(p => p.name),
          dtdirector: dirLista.map(d => d.name),
          dtcreator: creadoresLista.map(c => c.name),
          dtyear: anio ? [anio] : []
        },
        meta: {
          ids: tmdbId,
          original_title: baseData.original_title || baseData.original_name || '',
          original_name: baseData.original_title || baseData.original_name || '',
          tagline: baseData.tagline || '',
          dt_poster: baseData.poster_path || '', // Guardar ruta relativa para Movie Engine Pro
          dt_poster_url: posterPath,
          dt_backdrop: baseData.backdrop_path || '',
          imagenes: (baseData.images?.backdrops || []).slice(0, 8).map(i => i.file_path).join('\n'),
          release_date: fecha,
          first_air_date: fecha,
          last_air_date: baseData.last_air_date || '',
          runtime: String(baseData.runtime || (baseData.episode_run_time && baseData.episode_run_time[0]) || ''),
          imdbRating: baseData.vote_average ? baseData.vote_average.toFixed(1) : '',
          imdbVotes: String(baseData.vote_count || ''),
          youtube_id: trailerObj ? `[${trailerObj.key}]` : '',
          dt_cast: castLista.map(p => `[${p.profile_path || 'null'};${p.name},${p.character || ''}]`).join(''),
          dt_dir: dirLista.map(d => `[${d.profile_path || 'null'};${d.name}]`).join(''),
          dt_creator: creadoresLista.map(c => `[${c.profile_path || 'null'};${c.name}]`).join('')
        }
      };
    }

    async function obtenerIdGeneroWP(slugGenero) {
      const res = await wpFetch(`/wp/v2/genres?slug=${encodeURIComponent(slugGenero)}`);
      if (!res.ok) throw new Error(`No se pudo consultar el género en WordPress (${res.status})`);
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) return data[0].id;

      const nombre = SECCIONES_DOOPLAY[slugGenero] || slugGenero;
      const resSearch = await wpFetch(`/wp/v2/genres?search=${encodeURIComponent(nombre)}`);
      if (resSearch.ok) {
        const searchData = await resSearch.json();
        if (Array.isArray(searchData) && searchData.length > 0) return searchData[0].id;
      }
      return null;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await initSecurityLock();

      CRED_FIELDS.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('change', saveAllLocal);
      });

      document.getElementById('btn-lock-now').addEventListener('click', () => {
        sessionStorage.removeItem('mtv_man_unlocked');
        location.reload();
      });

      document.getElementById('btn-wipe-creds').addEventListener('click', () => {
        if (!confirm('¿Borrar credenciales guardadas?')) return;
        CRED_FIELDS.forEach(id => localStorage.removeItem('mtv_man_' + id));
        localStorage.removeItem('mtv_man_pin_hash');
        sessionStorage.removeItem('mtv_man_unlocked');
        location.reload();
      });

      const streamInput = document.getElementById('stream-url');
      const formatoSelect = document.getElementById('tipo-formato');
      streamInput.addEventListener('input', () => {
        const val = streamInput.value.trim();
        if (!val) return;
        if (val.includes('/v/')) formatoSelect.value = 'iframe';
        else if (/\.(mp4|mkv|webm|m3u8)(\?.*)?$/i.test(val)) formatoSelect.value = 'mp4';
      });

      document.getElementById('btn-test-wp').addEventListener('click', async () => {
        saveAllLocal();
        const wpUrl = getWpBaseUrl();
        const user = document.getElementById('wp-user').value.trim();
        const pass = document.getElementById('wp-pass').value.trim();
        const connStatus = document.getElementById('conn-status');
        if (!user || !pass) {
          connStatus.innerHTML = '<span style="color:#fca5a5;">Rellena tu usuario y contraseña de aplicación WP.</span>';
          return;
        }
        const btnTest = document.getElementById('btn-test-wp');
        btnTest.disabled = true;
        connStatus.innerHTML = `<span style="color:#94a3b8;">Verificando conexión con ${wpUrl}...</span>`;

        try {
          let res = await wpFetch('/wp/v2/users/me');
          if (res.status === 403 || res.status === 404) {
            res = await wpFetch('/wp/v2/movies?context=edit&per_page=1');
          }
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const nombre = data.name || user;
          connStatus.innerHTML = `<span style="color:#34d399;">✅ Conectado con éxito como <strong>${nombre}</strong></span>`;
        } catch (err) {
          connStatus.innerHTML = `<span style="color:#fca5a5;">❌ Error de conexión (${err.message})</span>`;
        } finally {
          btnTest.disabled = false;
        }
      });

      document.getElementById('btn-check').addEventListener('click', async () => {
        const tmdbApi = document.getElementById('tmdb-api').value.trim();
        const idInput = document.getElementById('tmdb-id').value.trim();
        const seccionSlug = document.getElementById('seccion').value;
        const outputBox = document.getElementById('output');

        if (!tmdbApi || !idInput) {
          outputBox.innerHTML = '<div style="color:#fca5a5;">Introduce la API Key de TMDB y el ID.</div>';
          return;
        }

        const btnCheck = document.getElementById('btn-check');
        btnCheck.disabled = true;
        outputBox.innerHTML = '<div style="color:#94a3b8;">Consultando TMDB en español...</div>';
        try {
          const info = await consultarTMDB(idInput, tmdbApi, seccionSlug);
          document.getElementById('prev-poster').src = info.previewPoster;
          document.getElementById('prev-title').textContent = info.titulo;
          document.getElementById('prev-meta').textContent = info.metaInfo;
          document.getElementById('prev-overview').textContent = info.sinopsis || 'Sin sinopsis disponible.';
          document.getElementById('preview-card').style.display = 'flex';
          outputBox.innerHTML = '';
        } catch (err) {
          outputBox.innerHTML = `<div style="color:#fca5a5;">Error: ${err.message}</div>`;
        } finally {
          btnCheck.disabled = false;
        }
      });

      const form = document.getElementById('generator-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        saveAllLocal();
        const btn = form.querySelector('button[type="submit"]');
        const outputBox = document.getElementById('output');
        btn.disabled = true;
        outputBox.innerHTML = '<div style="color:#94a3b8;">Publicando en WordPress e insertando reproductor streaming...</div>';

        try {
          const tmdbApi = document.getElementById('tmdb-api').value.trim();
          const idInput = document.getElementById('tmdb-id').value.trim();
          const seccionSlug = document.getElementById('seccion').value;
          const servidorNombre = document.getElementById('servidor-nombre').value.trim() || 'MorvehTV';
          const tipoFormato = document.getElementById('tipo-formato').value;
          const idioma = document.getElementById('idioma').value;
          const streamUrl = document.getElementById('stream-url').value.trim();

          const info = await consultarTMDB(idInput, tmdbApi, seccionSlug);

          // Estructura de reproductor compatible al 100% con Movie Engine Pro y DooPlay
          const fuentePlayer = {
            name: servidorNombre,
            type: tipoFormato,
            select: tipoFormato,
            idioma: idioma,
            url: streamUrl
          };

          // Inyectar en dt_player como JSON plano y limpiar dt_links para evitar tabla de descarga
          info.meta.dt_player = JSON.stringify([fuentePlayer]);
          info.meta.dt_links = '';

          const payload = {
            title: info.titulo,
            content: info.sinopsis,
            status: 'publish',
            meta: info.meta,
            dooplay_tax: info.taxonomias,
            dooplay_players: [fuenteProvider = fuentePlayer]
          };

          const genreId = await obtenerIdGeneroWP(seccionSlug);
          if (genreId) payload.genres = [genreId];

          const wpRes = await wpFetch(`/wp/v2/${info.postTypeEndpoint}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const resultado = await wpRes.json();
          if (!wpRes.ok) throw new Error(resultado.message || 'Error al publicar en WordPress');

          outputBox.innerHTML = `
            <div style="padding:14px;background:#163020;color:#a7f3d0;border-radius:8px;">
              <strong>✅ Publicado correctamente en DooPlay:</strong> ${info.titulo}<br>
              <strong>Sección:</strong> ${SECCIONES_DOOPLAY[seccionSlug]}<br>
              <strong>Reproductor de Nube:</strong> <code>${streamUrl}</code><br>
              <a href="${resultado.link}" target="_blank" style="color:#38bdf8;font-weight:600;">Ver publicación en MorvehTV →</a>
            </div>
          `;
        } catch (err) {
          outputBox.innerHTML = `
            <div style="padding:12px;background:#3b1518;color:#fca5a5;border-radius:8px;">
              <strong>❌ Error:</strong> ${err.message}
            </div>
          `;
        } finally {
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
