<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MorvehTV · Generador Completo (Películas, Series, Temporadas y Episodios)</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #181c26;
      --border: #2a3040;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 760px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }
    h1 { margin: 0 0 6px; font-size: 1.4rem; }
    p.sub { margin: 0 0 18px; color: var(--muted); font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-player { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .grid-auth { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
    .grid-3 { display: grid; grid-template-columns: 2fr 1fr auto; gap: 10px; align-items: end; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b0e14;
      color: var(--text);
      font-size: 0.95rem;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.btn-sec { background: #334155; }
    button.btn-sec:hover { background: #475569; }
    button.btn-publish { width: 100%; margin-top: 8px; padding: 13px; font-size: 1rem; background: var(--green); }
    button.btn-publish:hover { background: #059669; }
    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
      background: #0b0e14;
      padding: 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .mode-tab {
      background: transparent;
      color: var(--muted);
      padding: 9px;
      border-radius: 7px;
      font-size: 0.9rem;
    }
    .mode-tab.active {
      background: var(--accent);
      color: #fff;
    }
    #conn-status { font-size: 0.85rem; margin-bottom: 14px; }
    #preview-card {
      display: none;
      margin-bottom: 16px;
      padding: 14px;
      background: #0b0e14;
      border: 1px solid var(--border);
      border-radius: 10px;
      gap: 14px;
    }
    #preview-card img {
      width: 110px;
      height: 165px;
      object-fit: cover;
      border-radius: 6px;
      background: #1e293b;
    }
    #output { margin-top: 14px; font-size: 0.92rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <h1>MorvehTV · Generador Completo para DooPlay</h1>
    <p class="sub">Publica películas, fichas de series, temporadas completas y episodios individuales en castellano.</p>

    <form id="generator-form">
      <div class="grid-auth">
        <div class="field">
          <label for="wp-user">Usuario WordPress</label>
          <input type="text" id="wp-user" placeholder="Tu usuario admin" required />
        </div>
        <div class="field">
          <label for="wp-pass">Contraseña de Aplicación WP</label>
          <input type="password" id="wp-pass" placeholder="xxxx xxxx xxxx xxxx" required />
        </div>
        <div class="field">
          <button type="button" id="btn-test-wp" class="btn-sec">Probar conexión WP</button>
        </div>
      </div>
      <div id="conn-status"></div>

      <div class="field">
        <label for="tmdb-api">API Key de TMDB (v3)</label>
        <input type="text" id="tmdb-api" placeholder="Pega tu API Key de TMDB" required />
      </div>

      <label>¿Qué vas a publicar?</label>
      <div class="mode-tabs">
        <button type="button" class="mode-tab active" data-mode="ficha">Película / Ficha de Serie</button>
        <button type="button" class="mode-tab" data-mode="temporada">Temporada (Season)</button>
        <button type="button" class="mode-tab" data-mode="episodio">Episodio Individual</button>
      </div>
      <input type="hidden" id="publish-mode" value="ficha" />

      <div class="grid-3">
        <div class="field">
          <label for="tmdb-id">ID de TMDB o IMDb (de la película o de la serie madre)</label>
          <input type="text" id="tmdb-id" placeholder="Ej. tt33579608 o 1399" required />
        </div>
        <div class="field" id="seccion-wrapper">
          <label for="seccion">Sección en MorvehTV</label>
          <select id="seccion">
            <option value="peliculas">Películas</option>
            <option value="series">Series</option>
            <option value="peliculas-anime">Películas Anime</option>
            <option value="series-anime">Series Anime</option>
            <option value="documentales">Documentales</option>
            <option value="docuseries">Docuseries</option>
            <option value="programas-tv">Programas TV</option>
            <option value="telenovelas">Telenovelas</option>
          </select>
        </div>
        <div class="field">
          <button type="button" id="btn-check" class="btn-sec">Vista previa</button>
        </div>
      </div>

      <!-- Campos exclusivos para Temporada / Episodio -->
      <div class="grid" id="season-episode-fields" style="display:none;">
        <div class="field">
          <label for="num-temporada">Número de Temporada</label>
          <input type="number" id="num-temporada" min="0" value="1" />
        </div>
        <div class="field" id="episodio-field-box">
          <label for="num-episodio">Número de Episodio</label>
          <input type="number" id="num-episodio" min="1" value="1" />
        </div>
      </div>

      <div id="preview-card">
        <img id="prev-poster" src="" alt="Portada" />
        <div>
          <strong id="prev-title" style="font-size:1.1rem;"></strong>
          <div id="prev-meta" style="color:#94a3b8;font-size:0.85rem;margin:4px 0 8px;"></div>
          <p id="prev-overview" style="margin:0;font-size:0.86rem;color:#cbd5e1;max-height:95px;overflow:auto;"></p>
        </div>
      </div>

      <!-- Campos de vídeo -->
      <div id="player-fields">
        <div class="grid-player">
          <div class="field">
            <label for="servidor-nombre">Nombre del Servidor</label>
            <input type="text" id="servidor-nombre" value="MorvehTV" />
          </div>
          <div class="field">
            <label for="tipo-formato">Tipo de Formato</label>
            <select id="tipo-formato">
              <option value="iframe">URL Embed</option>
              <option value="mp4">URL MP4</option>
              <option value="shortcode">Shortcode or HTML</option>
            </select>
          </div>
          <div class="field">
            <label for="idioma">Idioma del Vídeo</label>
            <select id="idioma">
              <option value="es">Español (Castellano)</option>
              <option value="la">Español Latino</option>
              <option value="sub">Subtitulado</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="stream-url">Enlace / Código del Reproductor</label>
          <input type="text" id="stream-url" placeholder="https://nube.morvehtv.com/v/... o https://stream.morvehtv.com/...mp4" required />
        </div>
      </div>

      <button type="submit" class="btn-publish">Publicar en MorvehTV</button>
    </form>

    <div id="output"></div>
  </div>

  <script>
    const WP_URL = 'https://morvehtv.com';

    const SECCIONES_DOOPLAY = {
      'peliculas': 'Películas',
      'series': 'Series',
      'documentales': 'Documentales',
      'docuseries': 'Docuseries',
      'peliculas-anime': 'Películas Anime',
      'series-anime': 'Series Anime',
      'programas-tv': 'Programas TV',
      'telenovelas': 'Telenovelas'
    };

    function getAuthHeader() {
      const user = document.getElementById('wp-user').value.trim();
      const pass = document.getElementById('wp-pass').value.trim();
      return 'Basic ' + btoa(`${user}:${pass}`);
    }

    function formatearFuenteDooPlay(rawUrl, nombreServidor = 'MorvehTV', idioma = 'es', tipoFormato = 'iframe') {
      const urlLimpia = rawUrl.trim();
      if (!urlLimpia) return null;

      return {
        name: nombreServidor,
        select: tipoFormato, // 'iframe' (URL Embed) | 'mp4' (URL MP4) | 'shortcode' (Shortcode or HTML)
        idioma: idioma,
        url: urlLimpia
      };
    }

    async function resolverTmdbId(idInput, tmdbApiKey, endpointTipo) {
      const id = idInput.trim();
      if (!id.startsWith('tt')) return id;

      const findRes = await fetch(
        `https://api.themoviedb.org/3/find/${encodeURIComponent(id)}?api_key=${encodeURIComponent(tmdbApiKey)}&external_source=imdb_id&language=es-ES`
      );
      const findData = await findRes.json();
      const resultados = endpointTipo === 'tv' ? findData.tv_results : findData.movie_results;
      if (!resultados || resultados.length === 0) {
        throw new Error(`No se encontró ningún título en TMDB para el ID de IMDb: ${id}`);
      }
      return String(resultados[0].id);
    }

    // Busca el género existente en WordPress sin crear nunca ninguno nuevo
    async function obtenerIdGeneroWP(slugGenero, authHeader) {
      const res = await fetch(`${WP_URL}/wp-json/wp/v2/genres?slug=${encodeURIComponent(slugGenero)}`, {
        headers: { 'Authorization': authHeader }
      });
      if (!res.ok) throw new Error(`No se pudo consultar el género en WordPress (${res.status})`);
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) return data[0].id;

      const nombre = SECCIONES_DOOPLAY[slugGenero] || slugGenero;
      const resSearch = await fetch(`${WP_URL}/wp-json/wp/v2/genres?search=${encodeURIComponent(nombre)}`, {
        headers: { 'Authorization': authHeader }
      });
      if (resSearch.ok) {
        const searchData = await resSearch.json();
        if (Array.isArray(searchData) && searchData.length > 0) return searchData[0].id;
      }

      return null;
    }

    async function consultarTMDBPorModo({ mode, idInput, tmdbApiKey, seccionSlug, temporada, episodio }) {
      const esSerie = mode !== 'ficha' || ['series', 'series-anime', 'docuseries', 'programas-tv', 'telenovelas'].includes(seccionSlug);
      const endpointTipo = esSerie ? 'tv' : 'movie';
      const tmdbId = await resolverTmdbId(idInput, tmdbApiKey, endpointTipo);

      const baseRes = await fetch(
        `https://api.themoviedb.org/3/${endpointTipo}/${encodeURIComponent(tmdbId)}?api_key=${encodeURIComponent(tmdbApiKey)}&language=es-ES&append_to_response=videos,credits,images&include_image_language=es,en,null`
      );
      if (!baseRes.ok) throw new Error(`Error al consultar TMDB (${baseRes.status})`);
      const baseData = await baseRes.json();

      if (!baseData.overview) {
        const fbRes = await fetch(`https://api.themoviedb.org/3/${endpointTipo}/${encodeURIComponent(tmdbId)}?api_key=${encodeURIComponent(tmdbApiKey)}&language=es-MX`);
        if (fbRes.ok) {
          const fb = await fbRes.json();
          if (fb.overview) baseData.overview = fb.overview;
        }
      }

      if (mode === 'ficha') {
        const castLista = (baseData.credits?.cast || []).slice(0, 10);
        const dirLista = (baseData.credits?.crew || []).filter(c => c.job === 'Director');
        const creadoresLista = baseData.created_by || [];
        const videos = baseData.videos?.results || [];
        const trailerObj =
          videos.find(v => v.site === 'YouTube' && v.type === 'Trailer' && v.iso_639_1 === 'es') ||
          videos.find(v => v.site === 'YouTube' && v.type === 'Trailer') ||
          videos.find(v => v.site === 'YouTube');

        const fecha = baseData.release_date || baseData.first_air_date || '';
        const anio = fecha ? fecha.slice(0, 4) : '';

        return {
          postTypeEndpoint: esSerie ? 'tvshows' : 'movies',
          tmdbId,
          titulo: baseData.title || baseData.name,
          sinopsis: baseData.overview || '',
          fecha,
          previewPoster: baseData.poster_path ? `https://image.tmdb.org/t/p/w500${baseData.poster_path}` : '',
          metaInfo: `Nota: ${baseData.vote_average ? baseData.vote_average.toFixed(1) : 'N/A'} · Sección: ${SECCIONES_DOOPLAY[seccionSlug]}`,
          taxonomias: {
            dtcast: castLista.map(p => p.name),
            dtdirector: dirLista.map(d => d.name),
            dtcreator: creadoresLista.map(c => c.name),
            dtyear: anio ? [anio] : []
          },
          meta: {
            ids: tmdbId,
            original_title: baseData.original_title || baseData.original_name || '',
            original_name: baseData.original_title || baseData.original_name || '',
            tagline: baseData.tagline || '',
            dt_poster: baseData.poster_path || '',
            dt_backdrop: baseData.backdrop_path || '',
            imagenes: (baseData.images?.backdrops || []).slice(0, 8).map(i => i.file_path).join('\n'),
            release_date: fecha,
            first_air_date: fecha,
            last_air_date: baseData.last_air_date || '',
            runtime: String(baseData.runtime || (baseData.episode_run_time && baseData.episode_run_time[0]) || ''),
            imdbRating: baseData.vote_average ? baseData.vote_average.toFixed(1) : '',
            imdbVotes: String(baseData.vote_count || ''),
            number_of_seasons: String(baseData.number_of_seasons || ''),
            number_of_episodes: String(baseData.number_of_episodes || ''),
            youtube_id: trailerObj ? `[${trailerObj.key}]` : '',
            dt_cast: castLista.map(p => `[${p.profile_path || 'null'};${p.name},${p.character || ''}]`).join(''),
            dt_dir: dirLista.map(d => `[${d.profile_path || 'null'};${d.name}]`).join(''),
            dt_creator: creadoresLista.map(c => `[${c.profile_path || 'null'};${c.name}]`).join('')
          }
        };
      }

      if (mode === 'temporada') {
        const sRes = await fetch(
          `https://api.themoviedb.org/3/tv/${encodeURIComponent(tmdbId)}/season/${encodeURIComponent(temporada)}?api_key=${encodeURIComponent(tmdbApiKey)}&language=es-ES`
        );
        if (!sRes.ok) throw new Error(`No se encontró la Temporada ${temporada} en TMDB (${sRes.status})`);
        const sData = await sRes.json();

        const serieNombre = baseData.name || baseData.original_name;
        const tituloTemporada = `${serieNombre}: Temporada ${temporada}`;
        const poster = sData.poster_path || baseData.poster_path || '';

        return {
          postTypeEndpoint: 'seasons',
          tmdbId,
          titulo: tituloTemporada,
          sinopsis: sData.overview || baseData.overview || '',
          fecha: sData.air_date || '',
          previewPoster: poster ? `https://image.tmdb.org/t/p/w500${poster}` : '',
          metaInfo: `Serie: ${serieNombre} · Temporada ${temporada} (${(sData.episodes || []).length} episodios)`,
          taxonomias: {},
          meta: {
            ids: tmdbId,
            temporada: String(temporada),
            serie: serieNombre,
            dt_poster: poster,
            air_date: sData.air_date || ''
          }
        };
      }

      if (mode === 'episodio') {
        const eRes = await fetch(
          `https://api.themoviedb.org/3/tv/${encodeURIComponent(tmdbId)}/season/${encodeURIComponent(temporada)}/episode/${encodeURIComponent(episodio)}?api_key=${encodeURIComponent(tmdbApiKey)}&language=es-ES`
        );
        if (!eRes.ok) throw new Error(`No se encontró el Episodio ${temporada}x${episodio} en TMDB (${eRes.status})`);
        const eData = await eRes.json();

        const serieNombre = baseData.name || baseData.original_name;
        const nombreEp = eData.name || `Episodio ${episodio}`;
        const tituloEpisodio = `${serieNombre}: ${temporada}x${episodio}`;
        const still = eData.still_path || baseData.backdrop_path || '';

        return {
          postTypeEndpoint: 'episodes',
          tmdbId,
          titulo: tituloEpisodio,
          sinopsis: eData.overview || '',
          fecha: eData.air_date || '',
          previewPoster: still ? `https://image.tmdb.org/t/p/w500${still}` : '',
          metaInfo: `${serieNombre} · ${temporada}x${episodio} "${nombreEp}" · ${eData.runtime || '?'} min`,
          taxonomias: {},
          meta: {
            ids: tmdbId,
            temporada: String(temporada),
            episodio: String(episodio),
            episode_name: nombreEp,
            serie: serieNombre,
            dt_poster: still,
            dt_backdrop: still,
            air_date: eData.air_date || '',
            runtime: String(eData.runtime || '')
          }
        };
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      ['wp-user', 'wp-pass', 'tmdb-api'].forEach(id => {
        const saved = localStorage.getItem('morvehtv_' + id);
        if (saved) document.getElementById(id).value = saved;
      });

      const form = document.getElementById('generator-form');
      const outputBox = document.getElementById('output');
      const connStatus = document.getElementById('conn-status');
      const streamInput = document.getElementById('stream-url');
      const formatoSelect = document.getElementById('tipo-formato');

      // Auto-detecta el formato sugerido al pegar o escribir la URL, pero deja cambiarlo manualmente
      streamInput.addEventListener('input', () => {
        const val = streamInput.value.trim();
        if (!val) return;
        if (val.startsWith('[') || val.startsWith('<')) {
          formatoSelect.value = 'shortcode';
        } else if (/\.(mp4|mkv|webm|m3u8)(\?.*)?$/i.test(val) || val.includes('stream.morvehtv.com')) {
          formatoSelect.value = 'mp4';
        } else {
          formatoSelect.value = 'iframe';
        }
      });

      document.querySelectorAll('.mode-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const mode = tab.dataset.mode;
          document.getElementById('publish-mode').value = mode;

          const seBox = document.getElementById('season-episode-fields');
          const epBox = document.getElementById('episodio-field-box');
          const playerBox = document.getElementById('player-fields');
          const seccionWrapper = document.getElementById('seccion-wrapper');

          if (mode === 'ficha') {
            seBox.style.display = 'none';
            playerBox.style.display = 'block';
            streamInput.required = true;
            seccionWrapper.style.opacity = '1';
          } else if (mode === 'temporada') {
            seBox.style.display = 'grid';
            epBox.style.display = 'none';
            playerBox.style.display = 'none';
            streamInput.required = false;
            seccionWrapper.style.opacity = '0.45';
          } else {
            seBox.style.display = 'grid';
            epBox.style.display = 'block';
            playerBox.style.display = 'block';
            streamInput.required = true;
            seccionWrapper.style.opacity = '0.45';
          }
        });
      });

      document.getElementById('btn-test-wp').addEventListener('click', async () => {
        const user = document.getElementById('wp-user').value.trim();
        const pass = document.getElementById('wp-pass').value.trim();
        if (!user || !pass) {
          connStatus.innerHTML = '<span style="color:#fca5a5;">Escribe tu Usuario y Contraseña de Aplicación primero.</span>';
          return;
        }
        connStatus.innerHTML = '<span style="color:#94a3b8;">Comprobando conexión con morvehtv.com...</span>';
        try {
          const res = await fetch(`${WP_URL}/wp-json/wp/v2/users/me`, {
            headers: { 'Authorization': getAuthHeader() }
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || `Error HTTP ${res.status}`);

          localStorage.setItem('morvehtv_wp-user', user);
          localStorage.setItem('morvehtv_wp-pass', pass);
          connStatus.innerHTML = `<span style="color:#34d399;">Conectado correctamente como <strong>${data.name}</strong> en morvehtv.com</span>`;
        } catch (err) {
          connStatus.innerHTML = `<span style="color:#fca5a5;">Fallo de conexión: ${err.message}</span>`;
        }
      });

      document.getElementById('btn-check').addEventListener('click', async () => {
        const tmdbApi = document.getElementById('tmdb-api').value.trim();
        const idInput = document.getElementById('tmdb-id').value.trim();
        const mode = document.getElementById('publish-mode').value;
        const seccionSlug = document.getElementById('seccion').value;
        const temporada = document.getElementById('num-temporada').value;
        const episodio = document.getElementById('num-episodio').value;

        if (!tmdbApi || !idInput) {
          outputBox.innerHTML = '<div style="color:#fca5a5;">Introduce tu API Key de TMDB y un ID primero.</div>';
          return;
        }

        const btnCheck = document.getElementById('btn-check');
        btnCheck.disabled = true;
        outputBox.innerHTML = '<div style="color:#94a3b8;">Consultando ficha en castellano...</div>';
        try {
          const info = await consultarTMDBPorModo({ mode, idInput, tmdbApiKey: tmdbApi, seccionSlug, temporada, episodio });
          document.getElementById('prev-poster').src = info.previewPoster;
          document.getElementById('prev-title').textContent = info.titulo;
          document.getElementById('prev-meta').textContent = info.metaInfo;
          document.getElementById('prev-overview').textContent = info.sinopsis || 'Sin sinopsis disponible en español.';
          document.getElementById('preview-card').style.display = 'flex';
          outputBox.innerHTML = '';
        } catch (err) {
          outputBox.innerHTML = `<div style="color:#fca5a5;">Error: ${err.message}</div>`;
        } finally {
          btnCheck.disabled = false;
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        outputBox.innerHTML = '<div style="color:#94a3b8;">Publicando en MorvehTV y vinculando con DooPlay...</div>';

        try {
          const wpUser = document.getElementById('wp-user').value.trim();
          const wpPass = document.getElementById('wp-pass').value.trim();
          const tmdbApi = document.getElementById('tmdb-api').value.trim();
          const idInput = document.getElementById('tmdb-id').value.trim();
          const mode = document.getElementById('publish-mode').value;
          const seccionSlug = document.getElementById('seccion').value;
          const temporada = document.getElementById('num-temporada').value;
          const episodio = document.getElementById('num-episodio').value;
          const nombreServidor = document.getElementById('servidor-nombre').value.trim() || 'MorvehTV';
          const tipoFormato = document.getElementById('tipo-formato').value;
          const idioma = document.getElementById('idioma').value;
          const streamUrl = document.getElementById('stream-url').value.trim();

          localStorage.setItem('morvehtv_wp-user', wpUser);
          localStorage.setItem('morvehtv_wp-pass', wpPass);
          localStorage.setItem('morvehtv_tmdb-api', tmdbApi);

          const authHeader = getAuthHeader();
          const info = await consultarTMDBPorModo({ mode, idInput, tmdbApiKey: tmdbApi, seccionSlug, temporada, episodio });

          const payload = {
            title: info.titulo,
            content: info.sinopsis,
            status: 'publish',
            meta: info.meta
          };

          if (mode === 'ficha') {
            const genreId = await obtenerIdGeneroWP(seccionSlug, authHeader);
            if (genreId) payload.genres = [genreId];
            payload.dooplay_tax = info.taxonomias;
          }

          if (mode !== 'temporada') {
            const fuente = formatearFuenteDooPlay(streamUrl, nombreServidor, idioma, tipoFormato);
            payload.dooplay_players = fuente ? [fuente] : [];
          }

          const wpRes = await fetch(`${WP_URL}/wp-json/wp/v2/${info.postTypeEndpoint}`, {
            method: 'POST',
            headers: { 'Authorization': authHeader, 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const resultado = await wpRes.json();
          if (!wpRes.ok) throw new Error(resultado.message || 'Error al publicar en WordPress');

          outputBox.innerHTML = `
            <div style="padding:14px;background:#163020;color:#a7f3d0;border-radius:8px;">
              <strong>Publicado correctamente en DooPlay:</strong> ${info.titulo}<br>
              <strong>Tipo:</strong> ${info.postTypeEndpoint} · <strong>Formato:</strong> <code>${tipoFormato}</code><br>
              <a href="${resultado.link}" target="_blank" style="color:#38bdf8;font-weight:600;">Abrir en MorvehTV →</a>
            </div>
          `;
        } catch (err) {
          outputBox.innerHTML = `
            <div style="padding:12px;background:#3b1518;color:#fca5a5;border-radius:8px;">
              <strong>Error:</strong> ${err.message}
            </div>
          `;
        } finally {
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
